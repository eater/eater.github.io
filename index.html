<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Migrating Rubber Soul...</title>
    <script>
    const oldStorageKey = 'RubberSoul_v26.03';
    const targetURL = "https://rubbersoul.nyc/"; 

    window.onload = function() {
        const oldData = localStorage.getItem(oldStorageKey);
        
        if (oldData && oldData.length > 10) {
            // Compress AND URL-encode the payload so special characters survive the redirect
            const compressed = LZString.compressToEncodedURIComponent(oldData);
            const safePayload = encodeURIComponent(compressed);
            
            window.location.href = targetURL + "?nocache=" + new Date().getTime() + "#migrate=" + safePayload;
        } else {
            window.location.href = targetURL;
        }
    };
</script>
</head>
<body style="background-color: #1b5e20; color: #fff; font-family: sans-serif; text-align: center; padding: 50px;">
    <div style="font-size: 80px; margin-bottom: 20px;">♠</div>
    <h2>Migrating your saved games to our new home...</h2>
    <p>Please wait a moment.</p>
</body>
</html>
